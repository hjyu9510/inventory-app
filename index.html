<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>체화재고 슬랙 알림</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.1);
    --green-border: rgba(63,185,80,0.3);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.1);
    --amber: #d29922;
    --amber-bg: rgba(210,153,34,0.1);
    --radius: 8px;
    --radius-lg: 12px;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .container { max-width: 620px; margin: 0 auto; }

  header { margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  header p { font-size: 13px; color: var(--text2); margin-top: 6px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    margin-bottom: 12px;
  }
  .card-label {
    font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 10px;
  }

  input[type="url"] {
    width: 100%; background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 9px 12px;
    font-size: 13px; font-family: 'JetBrains Mono', monospace;
    color: var(--text); outline: none; transition: border-color .15s;
  }
  input[type="url"]:focus { border-color: var(--green-border); }
  input::placeholder { color: var(--text3); }

  .file-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .file-drop {
    background: var(--bg3); border: 1px dashed var(--border2);
    border-radius: var(--radius); padding: 22px 12px;
    text-align: center; cursor: pointer; transition: all .2s;
  }
  .file-drop:hover { border-color: var(--green-border); background: rgba(63,185,80,0.04); }
  .file-drop.loaded { border-style: solid; border-color: var(--green-border); background: var(--green-bg); }
  .file-drop input { display: none; }
  .file-drop .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
  .file-drop .dlabel { font-size: 13px; font-weight: 600; color: var(--text2); }
  .file-drop .fname { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--green); margin-top: 5px; word-break: break-all; line-height: 1.4; }

  .stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
  .stat { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 8px; text-align: center; }
  .stat .sv { font-size: 20px; font-weight: 700; }
  .stat .sl { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .sv.g { color: var(--green); }
  .sv.r { color: var(--red); }
  .sv.a { color: var(--amber); }

  .preview {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    line-height: 1.8; color: var(--text); white-space: pre-wrap;
    word-break: break-all; max-height: 400px; overflow-y: auto;
  }
  .preview::-webkit-scrollbar { width: 4px; }
  .preview::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1; padding: 11px; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; border: 1px solid var(--border2);
    background: var(--bg3); color: var(--text2);
    transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { color: var(--text); background: var(--bg2); }
  .btn.primary { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
  .btn.primary:hover { background: rgba(63,185,80,0.18); }
  .btn:disabled { opacity: .3; cursor: not-allowed; pointer-events: none; }

  .toast {
    margin-top: 12px; padding: 11px 14px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; display: none; align-items: center; gap: 8px;
  }
  .toast.ok { display: flex; background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
  .toast.err { display: flex; background: var(--red-bg); border: 1px solid rgba(248,81,73,.3); color: var(--red); }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin .6s linear infinite; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📦 체화재고 슬랙 알림</h1>
    <p>거세 · 암소 CSV 업로드 후 슬랙으로 전송</p>
  </header>

  <div class="card">
    <div class="card-label">슬랙 웹훅 URL</div>
    <input type="url" id="webhookUrl"
      placeholder="https://hooks.slack.com/services/..." />
  </div>

  <div class="card">
    <div class="card-label">CSV 파일 업로드</div>
    <div class="file-grid">
      <div class="file-drop" id="drop1" onclick="document.getElementById('f1').click()">
        <input type="file" id="f1" accept=".csv" onchange="loadFile(this,1)">
        <span class="emoji">🐂</span>
        <div class="dlabel">거세</div>
        <div class="fname" id="fn1">클릭하여 선택</div>
      </div>
      <div class="file-drop" id="drop2" onclick="document.getElementById('f2').click()">
        <input type="file" id="f2" accept=".csv" onchange="loadFile(this,2)">
        <span class="emoji">🐄</span>
        <div class="dlabel">암소</div>
        <div class="fname" id="fn2">클릭하여 선택</div>
      </div>
    </div>
  </div>

  <div class="card" id="statsCard" style="display:none">
    <div class="card-label">오늘 현황</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <div class="card-label">메시지 미리보기</div>
    <div class="preview" id="previewBox"></div>
  </div>

  <div class="btn-row">
    <button class="btn" id="previewBtn" onclick="doPreview()" disabled>👁 미리보기</button>
    <button class="btn primary" id="sendBtn" onclick="doSend()" disabled>📨 슬랙 전송</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
let csvData = {1: null, 2: null};

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].replace(/^\uFEFF/, '').split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); });
    return obj;
  }).filter(r => r['주차'] && r['주차'].length > 0);
}

function loadFile(input, num) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    csvData[num] = parseCSV(e.target.result);
    document.getElementById('fn' + num).textContent = file.name;
    document.getElementById('drop' + num).classList.add('loaded');
    checkReady();
    if (csvData[1] && csvData[2]) doPreview();
  };
  reader.readAsText(file, 'UTF-8');
}

function checkReady() {
  const both = csvData[1] || csvData[2];
  const hasUrl = document.getElementById('webhookUrl').value.trim().startsWith('https://');
  document.getElementById('previewBtn').disabled = !(csvData[1] || csvData[2]);
  document.getElementById('sendBtn').disabled = !(both && hasUrl);
  if (both) updateStats();
}

const savedUrl = localStorage.getItem('slackWebhookUrl');
if (savedUrl) document.getElementById('webhookUrl').value = savedUrl;

document.getElementById('webhookUrl').addEventListener('input', e => {
  localStorage.setItem('slackWebhookUrl', e.target.value);
  checkReady();
});

function updateStats() {
  const all = [...csvData[1], ...csvData[2]];
  const tkg = all.reduce((s, r) => s + parseFloat(r['중량'] || 0), 0);
  const crit = all.filter(r => r['주차'] === '5주차 이상').length;
  const w4 = all.filter(r => r['주차'] === '4주차').length;
  document.getElementById('statsCard').style.display = 'block';
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="sv g">${all.length}건</div><div class="sl">총 건수</div></div>
    <div class="stat"><div class="sv g">${Math.round(tkg*10)/10}kg</div><div class="sl">총 중량</div></div>
    <div class="stat"><div class="sv r">${crit}건</div><div class="sl">🚨 5주차+</div></div>
    <div class="stat"><div class="sv a">${w4}건</div><div class="sl">🔴 4주차</div></div>
  `;
}

function buildMessage() {
  const days = ['일','월','화','수','목','금','토'];
  const now = new Date();
  const today = `${now.getMonth()+1}월 ${now.getDate()}일(${days[now.getDay()]})`;
  let msg = `*📦 체화재고 현황 | ${today}*\n\n`;

  const groups = [{n:'거세',e:'🐂',d:csvData[1]||[]},{n:'암소',e:'🐄',d:csvData[2]||[]}];
  for (const grp of groups) {
    const tkg = grp.d.reduce((s, r) => s + parseFloat(r['중량'] || 0), 0);
      if (!grp.d.length) { msg += `\n${grp.e} *${grp.n}* - 재고 없음\n─────────────────────────────\n`; continue; }
      msg += `\n${grp.e} *${grp.n}* - 총 ${grp.d.length}건 / ${Math.round(tkg*10)/10}kg\n─────────────────────────────\n`;
    for (const wk of ['5주차 이상','4주차','3주차']) {
      const items = grp.d.filter(r => r['주차'] === wk);
      if (!items.length) continue;
      const wkg = items.reduce((s,r) => s + parseFloat(r['중량']||0), 0);
      const icon = wk==='5주차 이상' ? '🚨' : wk==='4주차' ? '🔴' : '🟡';
      msg += `${icon} *${wk}* (${items.length}건 / ${Math.round(wkg*10)/10}kg)\n`;
      for (const item of items) {
        const m = Math.round(parseFloat(item['매익률']||0)*100*10)/10;
        const dc = Math.round(parseFloat(item['할인률']||0)*100*10)/10;
        const buy = Math.round(parseFloat(item['매입단가']||0)).toLocaleString('ko-KR');
        const sell = Math.round(parseFloat(item['판매단가']||0)).toLocaleString('ko-KR');
        const disc = Math.round(parseFloat(item['할인단가']||0)).toLocaleString('ko-KR');
        const wt = Math.round(parseFloat(item['중량']||0)*10)/10;
        msg += `• *${item['부위']}* [${item['등급']}] ${wt}kg · ${item['수량']}개\n`;
        msg += `    • 매입 ${buy}원  |  판매 ${sell}원\n`;
        msg += `    • 할인율 ${dc}%  |  할인 ${disc}원 (매익 ${m}%)\n\n`;
      }
      msg += '\n';
    }
  }

  const all = [...(csvData[1]||[]), ...(csvData[2]||[])];
  const tkg = all.reduce((s,r) => s + parseFloat(r['중량']||0), 0);
  const crit = all.filter(r => r['주차'] === '5주차 이상').length;
  msg += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n✅ *총 ${all.length}건 / ${Math.round(tkg*10)/10}kg*`;
  if (crit > 0) msg += `  🚨 즉시처리 ${crit}건`;
  return msg;
}

function doPreview() {
  if (!csvData[1] && !csvData[2]) return;
  document.getElementById('previewCard').style.display = 'block';
  document.getElementById('previewBox').textContent = buildMessage();
}

async function doSend() {
  const url = document.getElementById('webhookUrl').value.trim();
  if (!url || (!csvData[1] && !csvData[2])) return;

  const btn = document.getElementById('sendBtn');
  const toast = document.getElementById('toast');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">⟳</span> 전송 중...';
  toast.className = 'toast';

  try {
    const res = await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ webhookUrl: url, message: buildMessage(), csvData: { d1: csvData[1], d2: csvData[2], date: (()=>{ const days=['일','월','화','수','목','금','토']; const now=new Date(); return `${now.getMonth()+1}월 ${now.getDate()}일(${days[now.getDay()]})`; })() } })
    });
    const data = await res.json();
    if (res.ok) {
      toast.className = 'toast ok';
      toast.textContent = '✅ 슬랙 전송 완료!';
    } else {
      toast.className = 'toast err';
      toast.textContent = `❌ 실패: ${data.error}`;
    }
  } catch (e) {
    toast.className = 'toast err';
    toast.textContent = `❌ 오류: ${e.message}`;
  }

  btn.disabled = false;
  btn.innerHTML = '📨 슬랙 전송';
}
</script>
</body>
</html>
